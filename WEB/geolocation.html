<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CS50 Web Exercises | Geolocation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <h1>Geolocation Example</h1>
      <nav class="site-nav">
        <a href="home.html">Home</a>
        <a href="hello.html">Hello</a>
        <a href="image.html">Image</a>
        <a href="search.html">Search</a>
        <a href="table.html">Table</a>
        <a href="ul.html">Lists</a>
        <a href="JS.html">JavaScript</a>
        <a href="realexpressions.html">Validation</a>
      </nav>
    </header>
    <main>
      <p id="output">Fetching location...</p>
    </main>
    <footer class="site-footer">
      <p>Uses the browser Geolocation API to read coordinates.</p>
    </footer>
  </div>
  <script>
    const output = document.getElementById('output');

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        position => {
          output.textContent = `Latitude: ${position.coords.latitude.toFixed(6)}, Longitude: ${position.coords.longitude.toFixed(6)}`;
        },
        error => {
          output.textContent = `Error: ${error.message}`;
        }
      );
    } else {
      output.textContent = 'Geolocation is not supported by this browser.';
    }
  </script>
</body>
</html>
